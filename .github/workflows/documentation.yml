name: Documentation

on:
  pull_request:
  push:
    branches: [main, v0.9.1]

permissions:
  contents: read

jobs:
  metadata-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate version metadata and documentation
        run: python scripts/check_docs.py
